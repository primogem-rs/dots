git:
  diffRenderers:
    - command: delta --dark --syntax-theme=gruvbox-dark --paging=never

gui:
  nerdFontsVersion: "3"
  colorScheme: dark
  # Gruvbox Dark Hard; the #1d2021 background is inherited from the terminal.
  theme:
    activeBorderColor:
      - "#fabd2f"
      - bold
    inactiveBorderColor:
      - "#665c54"
    optionsTextColor:
      - "#83a598"
    selectedLineBgColor:
      - "#3c3836"
    inactiveViewSelectedLineBgColor:
      - "#282828"
    cherryPickedCommitBgColor:
      - "#458588"
    cherryPickedCommitFgColor:
      - "#ebdbb2"
    markedBaseCommitBgColor:
      - "#d79921"
    markedBaseCommitFgColor:
      - "#1d2021"
    unstagedChangesColor:
      - "#fb4934"
    defaultFgColor:
      - "#ebdbb2"
    searchingActiveBorderColor:
      - "#83a598"
      - bold
