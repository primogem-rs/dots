theme = "gruvbox_dark_hard"

[editor]
color-modes = true
cursorline = true
line-number = "relative"
end-of-line-diagnostics = "hint"
completion-timeout = 5

[editor.soft-wrap]
enable = true

[editor.lsp]
display-inlay-hints = true

[editor.inline-diagnostics]
cursor-line = "error"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.normal]
"g" = { "v" = ["vsplit", "jump_view_up", "goto_definition"] }
